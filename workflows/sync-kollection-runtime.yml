name: Sync Kollection AIO Runtime

on:
  push:
    paths:
      - '.github/workflows/sync-kollection-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # IMPORTANT:
      # runtime/database.kaoxt.js is owned by The Kollection and is the
      # production source of truth for collection groups, folders and artwork.
      # Do not download or overwrite it from ImKaptain/Kaptain-Collection.
      - name: Download current AIO runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime

          curl -fL --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/ImKaptain/Kaptain-Collection/main/collections/kaoxt-aio-catalogs.json' \
            -o runtime/kaoxt-aio-catalogs.json

          curl -fL --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/ImKaptain/Kaptain-Collection/main/collections/kaoxt-aio-base-config.json' \
            -o runtime/kaoxt-aio-base-config.json

      - name: Validate runtime assets
        shell: bash
        run: |
          set -euo pipefail
          test -s runtime/database.kaoxt.js
          test -s runtime/kaoxt-aio-catalogs.json
          test -s runtime/kaoxt-aio-base-config.json
          grep -q 'window.NUVIO_DATABASE' runtime/database.kaoxt.js
          python -m json.tool runtime/kaoxt-aio-catalogs.json >/dev/null
          python -m json.tool runtime/kaoxt-aio-base-config.json >/dev/null

      - name: Commit AIO runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Only the AIO helper assets are allowed to be refreshed from upstream.
          # The Kollection database intentionally remains untouched.
          git add runtime/kaoxt-aio-catalogs.json runtime/kaoxt-aio-base-config.json

          if git diff --cached --quiet; then
            echo 'AIO runtime assets are already current.'
            exit 0
          fi

          git commit -m 'Sync Kollection AIO runtime assets'
          git push
