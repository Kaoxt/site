name: Deploy Posters v2 Renderer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'poster-renderer-v2/**'
      - '.github/workflows/deploy-posters-v2.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: poster-renderer-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Create renderer secret file
        shell: bash
        run: |
          umask 077
          printf 'RENDERER_AUTH_TOKEN=%s\n' "$POSTERS_RENDERER_AUTH_TOKEN" > .env.production
        env:
          POSTERS_RENDERER_AUTH_TOKEN: ${{ secrets.POSTERS_RENDERER_AUTH_TOKEN }}

      - name: Deploy Worker + Sharp container
        run: npx wrangler deploy --secrets-file .env.production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove temporary secret file
        if: always()
        run: rm -f .env.production
