name: Test poster delivery

on:
  push:
    paths:
      - 'functions/api/posters-v2/**'
      - 'functions/api/posters-manifest/**'
      - 'functions/api/posters-addon/**'
      - 'functions/api/posters-preview-samples.js'
      - 'functions/_lib/poster-*.js'
      - 'posters.html'
      - 'posters/posters.js'
      - 'posters/preview-controller.js'
      - 'posters/addon.js'
      - 'posters/manifest-final.js'
      - 'posters/overlays.css'
      - 'tests/poster-cache.test.mjs'
      - 'tests/setup-poster-routing.test.mjs'
      - 'set-up-collection/poster-settings.js'
      - 'set-up-collection/set-up-collection.js'
      - 'set-up-collection/saved-setup.js'
      - 'set-up-collection/folder-editor.js'
      - 'set-up-collection/folder-editor.css'
      - 'set-up-collection/existing-setup-picker.js'
      - 'set-up-collection/folder-editor.js'
      - 'set-up-collection/folder-editor.css'
      - 'set-up-collection/existing-setup-picker.js'
      - 'set-up-collection.html'
      - 'poster-renderer-v2/**'
      - '.github/workflows/test-posters.yml'
  pull_request:
    paths:
      - 'functions/api/posters-v2/**'
      - 'functions/api/posters-manifest/**'
      - 'functions/api/posters-addon/**'
      - 'functions/api/posters-preview-samples.js'
      - 'functions/_lib/poster-*.js'
      - 'posters.html'
      - 'posters/posters.js'
      - 'posters/preview-controller.js'
      - 'posters/addon.js'
      - 'posters/manifest-final.js'
      - 'posters/overlays.css'
      - 'tests/poster-cache.test.mjs'
      - 'tests/setup-poster-routing.test.mjs'
      - 'set-up-collection/poster-settings.js'
      - 'set-up-collection/set-up-collection.js'
      - 'set-up-collection/saved-setup.js'
      - 'set-up-collection.html'
      - 'poster-renderer-v2/**'
      - '.github/workflows/test-posters.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/poster-cache.test.mjs tests/setup-poster-routing.test.mjs

  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: poster-renderer-v2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
